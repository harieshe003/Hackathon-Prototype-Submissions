<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18A957"/>
      <stop offset="100%" stop-color="#087C55"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008C95"/>
      <stop offset="100%" stop-color="#063B5C"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087CA3"/>
      <stop offset="100%" stop-color="#008C95"/>
    </linearGradient>
  </defs>

  <!-- Eye / Lens Outer Shape -->
  <g transform="translate(10, 10)">
    <!-- Top Eye Arch with Leaf Tip -->
    <path d="M 30,70 C 60,20 140,10 180,35 C 150,22 80,35 45,72 Z" fill="url(#leafGrad)"/>
    
    <!-- Outer Eye Swoosh -->
    <path d="M 20,70 Q 100,10 180,35 Q 170,120 100,130 Q 30,120 20,70 Z" fill="none" stroke="#008C95" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Center Iris Lens Circle -->
    <circle cx="100" cy="70" r="40" fill="url(#lensGrad)"/>
    
    <!-- Mountain Silhouettes inside Iris -->
    <path d="M 68,90 L 85,65 L 98,80 L 115,55 L 132,90 Z" fill="#087C55" opacity="0.9"/>
    
    <!-- Flowing River Stream -->
    <path d="M 85,90 Q 95,78 100,85 Q 105,92 115,105 Q 100,110 85,90 Z" fill="url(#riverGrad)"/>

    <!-- Sun / Lens Reflection Dot -->
    <circle cx="82" cy="55" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="210" y="95" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="52" fill="#18A957">Eco<tspan fill="#063B5C">Lens</tspan></text>
  <text x="212" y="128" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="16" fill="#102A32" letter-spacing="0.5">Five Lenses. One Sustainable Choice.</text>
</svg>
